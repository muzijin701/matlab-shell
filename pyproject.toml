[project]
name = "matlab-shell"
version = "0.1.0"
description = "Interactive MATLAB CLI shell in your terminal"
readme = "README.md"
authors = [
    { name = "chenjinchi", email = "muzijin702@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
matlab-shell = "matlab_shell:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
